# VenturePulse v2 - Docker Compose Configuration
# Run with: docker-compose up

services:
  web:
    build:
      context: .
      args:
        - DOCKERUSER=${DOCKERUSER:-venturepulse}
    container_name: ${DOCKERUSER:-venturepulse}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    volumes:
      # Persistent data storage (database, reports, specs)
      - ./data:/app/data
      # Mount prompts for easy editing (read-only in production)
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

# Named volumes for data persistence
volumes:
  data:
