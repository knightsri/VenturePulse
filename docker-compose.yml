# VenturePulse v2 - Docker Compose Configuration
# Run with: docker-compose up

services:
  web:
    build: .
    container_name: venturepulse
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    volumes:
      # Persistent data storage (database, reports, specs)
      - ./data:/app/data
      # Mount prompts for easy editing (read-only in production)
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

# Named volumes for data persistence
volumes:
  data:
