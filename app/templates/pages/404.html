{% extends "base.html" %}

{% block title %}Page Not Found - VenturePulse{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: var(--space-16) var(--space-4);">
    <div class="error-page">
        <div class="error-code" style="font-size: 8rem; font-weight: 700; color: var(--color-primary); line-height: 1;">
            404
        </div>
        <h1 style="margin: var(--space-4) 0;">Page Not Found</h1>
        <p class="text-muted" style="font-size: var(--font-size-lg); max-width: 500px; margin: 0 auto var(--space-8);">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="flex gap-4 justify-center">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="/browse" class="btn btn-secondary">Browse Projects</a>
        </div>
    </div>
</div>
{% endblock %}
